name: Publish

# `pnpm -r publish` publishes only the workspace packages whose version is not
# on the registry yet, so bumping one subpackage publishes exactly that one.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance (OIDC trusted publisher)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.9

      # No `registry-url` here on purpose. It would write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and
      # with no NPM_TOKEN secret that resolves to a placeholder, so pnpm sends
      # bogus credentials and the registry answers 404 instead of the real
      # auth error. Each package pins its registry in `publishConfig`, and
      # OIDC is the only credential this workflow should use.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & typecheck
        run: pnpm run check

      - name: Publish unpublished packages
        run: pnpm -r publish --access public --no-git-checks --provenance
