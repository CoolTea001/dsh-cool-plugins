name: Publish

# `pnpm -r publish` publishes only the workspace packages whose version is not
# on the registry yet, so bumping one subpackage publishes exactly that one.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # push the release tags and create their GitHub releases
  id-token: write # npm provenance (OIDC trusted publisher)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.9

      # No `registry-url` here on purpose. It would write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and
      # with no NPM_TOKEN secret that resolves to a placeholder, so pnpm sends
      # bogus credentials and the registry answers 404 instead of the real
      # auth error. Each package pins its registry in `publishConfig`, and
      # OIDC is the only credential this workflow should use.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & typecheck
        run: pnpm run check

      # `--report-summary` records exactly what this run published, which is what
      # the next step needs: the registry is the only authority on what shipped,
      # and `publishedPackages` is `[]` when nothing did.
      - name: Publish unpublished packages
        run: pnpm -r publish --access public --no-git-checks --provenance --report-summary

      # Tagging comes after a successful publish, never before: a tag that exists
      # and points at a failed publish claims a release that never shipped. Each
      # package gets `<name>@<version>`, because one `vX.Y.Z` sequence cannot name
      # two packages in this repository.
      - name: Tag and release what was published
        env:
          # `git tag -a` writes an annotated tag object, and writing a tag object
          # needs a committer identity. The runner image ships no `user.name` /
          # `user.email`, so the tag aborts with "empty ident name" (exit 128)
          # even though the publish itself succeeded.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # `gh` has no implicit credential — GITHUB_TOKEN is only exported to
          # the workflow, not to the CLI. Without GH_TOKEN every `gh release`
          # call fails with "set the GH_TOKEN environment variable".
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh pnpm-publish-summary.json
