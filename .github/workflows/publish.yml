name: Publish

# `pnpm -r publish` publishes only the workspace packages whose version is not
# on the registry yet, so bumping one subpackage publishes exactly that one.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance (OIDC trusted publisher)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & typecheck
        run: pnpm run check

      - name: Publish unpublished packages
        run: pnpm -r publish --access public --no-git-checks --provenance
